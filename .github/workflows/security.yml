name: security

# Secret scan + Rust supply-chain checks. Actions pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any push: catches a CVE disclosed against a
    # dependency already sitting in Cargo.lock, which a push-only trigger
    # would never re-check once merged.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scan: the shared mechubsec workflow (pinned gitleaks binary; no
  # license needed, unlike gitleaks-action on org repos).
  secrets:
    uses: mechubsec/.github/.github/workflows/gitleaks.yml@fb1a159c596bf2c57b9f6f1ff99f546463a6a84a

  # Each vendor rule in .gitleaks-vendor.toml has a positive/negative sample
  # pair under tests/gitleaks-rules/; this proves the rule still matches (and
  # doesn't over-match) instead of only being checked by hand at review time.
  gitleaks-rule-samples:
    name: gitleaks rule samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same pinned version + checksum as mechubsec/.github's gitleaks.yml,
      # so the rule samples are verified against the exact binary CI scans
      # with.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
      - name: Run rule sample tests
        run: bash tests/gitleaks-rules/run.sh

  cargo:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-audit (RUSTSEC advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # fuzz/ is its own workspace with its own lockfile; unaudited, it sat
      # seven advisories behind the main one.
      - name: cargo-audit (fuzz/Cargo.lock)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: fuzz
      # Installed directly rather than via cargo-deny-action, which builds its
      # own image and so depends on Docker Hub at run time. That dependency
      # failed this job once already — three retries of
      # "dial tcp ...:443: i/o timeout" on the base image, with nothing wrong in
      # the repo. A supply-chain gate that goes red on an unrelated registry
      # outage is a gate people learn to ignore. Slower, but it only depends on
      # crates.io, which the job already needs. Matches rustpanosmcp.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny (advisories + licenses + bans + sources)
        run: cargo deny check advisories licenses bans sources

  trivy-fs:
    name: trivy (filesystem)
    # mecmcp ships no container image of its own -- it is a family of
    # library crates consumed by other repos' images (see the sbom job's
    # comment below) -- so only the filesystem scanner applies here. Image
    # scanning belongs to the consumer repos that actually build one, e.g.
    # rustjunosmcp's security.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installed from the upstream release binary rather than via
      # aquasecurity/trivy-action, which runs as a Docker container action
      # and so pulls aquasec/trivy from Docker Hub at run time -- the same
      # failure mode documented on the cargo-deny job above. Checksum pinned
      # against the release's published checksums.txt. Version matches
      # rustjunosmcp's security.yml for consistency across the org.
      - name: Install trivy
        env:
          TRIVY_VERSION: "0.73.0"
          TRIVY_SHA256: "2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b"
        run: |
          set -euo pipefail
          curl -sSfL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          rm -f trivy.tar.gz trivy
      - name: trivy fs (vulnerabilities + secrets)
        # --secret-config allowlists the one fabricated PEM test fixture in
        # mecmcp-redact (see trivy-secret.yaml); Trivy does not read
        # .gitleaksignore.
        run: trivy fs --scanners vuln,secret --secret-config trivy-secret.yaml --exit-code 1 --severity HIGH,CRITICAL .

  sbom:
    name: Generate and validate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Version-pinned, matching the cargo-deny job's reasoning above (no
      # Docker Hub dependency, only crates.io) and RELEASE-ARTIFACTS.md's
      # SBOM standard: the generator version is pinned because the SBOM is
      # not byte-for-byte reproducible (timestamps, serial numbers), but the
      # *component set* must be stable across runs.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      # One SBOM per workspace crate: mecmcp ships as a family of library
      # crates consumed by six other repos, not as a single release binary,
      # so there is no one artifact to attach a single SBOM to. Each
      # consumer's own release pipeline (see RELEASE-ARTIFACTS.md) generates
      # the binary-level SBOM for its shipped archive; this is the check that
      # every crate in the family a consumer might pull in has one that
      # validates.
      - name: Generate SBOMs
        run: cargo cyclonedx --format json --all
      - name: Validate SBOM shape
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(crates/*/*.cdx.json)
          if [[ ${#sboms[@]} -eq 0 ]]; then
            echo "no SBOM files were generated" >&2
            exit 1
          fi
          for sbom in "${sboms[@]}"; do
            echo "validating $sbom"
            crate_dir=$(basename "$(dirname "$sbom")")
            format=$(jq -r '.bomFormat' "$sbom")
            [[ "$format" == "CycloneDX" ]] || {
              echo "$sbom: bomFormat is '$format', not CycloneDX" >&2
              exit 1
            }
            component_name=$(jq -r '.metadata.component.name' "$sbom")
            [[ "$component_name" == "$crate_dir" ]] || {
              echo "$sbom: metadata.component.name is '$component_name', expected '$crate_dir'" >&2
              exit 1
            }
            component_count=$(jq '.components | length' "$sbom")
            [[ "$component_count" -gt 0 ]] || {
              echo "$sbom: components array is empty" >&2
              exit 1
            }
            # A nested checkout, worktree, or the build machine's own layout
            # leaking into the SBOM means it was scanned from an absolute
            # path rather than the crate root -- same failure mode
            # RELEASE-ARTIFACTS.md documents for the per-repo binary SBOM.
            if grep -Eq '"/(home|workspace|workspaces|runner|tmp)/' "$sbom"; then
              echo "$sbom contains an absolute build-machine path" >&2
              exit 1
            fi
          done
      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mecmcp-sboms
          path: crates/*/*.cdx.json
          retention-days: 90
