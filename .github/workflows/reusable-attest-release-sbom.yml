name: Reusable / attest release SBOM

# Shared "generate SBOM, attach to release, cosign attest on image" pipeline,
# called via `workflow_call` from a vendor repo's own `on: release:
# published` workflow.
#
# Extracted from rustjunosmcp's release-sbom.yml after a race (MEC-2133): the
# image push (a repo's own `Release image`, triggered by the tag push) and
# this job (triggered by the release being published) are independent
# events with no ordering guarantee between them, so resolving the image
# digest right after a release is published can run before the image
# finishes pushing. `Resolve image digest` below polls instead of looking up
# the digest once, so every caller gets the fix instead of re-deriving it.
#
# The calling job MUST grant these permissions itself -- a reusable
# workflow's permissions can only be narrowed by the caller, never widened:
#   permissions:
#     contents: write   # gh release upload
#     packages: write   # cosign attest pushes the attestation to GHCR
#     id-token: write   # keyless cosign signing

on:
  workflow_call:
    inputs:
      image:
        description: 'Full GHCR image path, e.g. ghcr.io/mechubsec/rust-junosmcp'
        required: true
        type: string
      version:
        description: 'Image tag to resolve the digest for, e.g. 1.2.3 (no leading v). Falls back to the release tag with a leading v stripped when empty.'
        required: false
        type: string
        default: ''
      cargo-manifest-path:
        description: 'Path to the Cargo.toml of the workspace member whose binary ships in the image, e.g. rust-junosmcp/Cargo.toml'
        required: true
        type: string
      sbom-file:
        description: 'Path cargo-cyclonedx writes the SBOM to for cargo-manifest-path, e.g. rust-junosmcp/rust-junosmcp.cdx.json'
        required: true
        type: string
      cargo-cyclonedx-version:
        description: 'Pinned cargo-cyclonedx version for --version. Empty installs whatever --locked resolves.'
        required: false
        type: string
        default: '0.5.9'
      digest-max-attempts:
        description: 'Number of 60s-spaced attempts to resolve the image digest before failing (default ~20 min total).'
        required: false
        type: number
        default: 20

jobs:
  attest:
    name: Generate SBOM, attach to release, attest on image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write # gh release upload
      packages: write # cosign attest pushes the attestation to GHCR
      id-token: write # keyless cosign signing
    steps:
      - name: Require a published release
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ -n "$TAG" ]] || { echo "must be called from a 'release: published' workflow" >&2; exit 1; }
          if [[ -n "$VERSION_INPUT" && "$VERSION_INPUT" != "${TAG#v}" ]]; then
            echo "version input '$VERSION_INPUT' does not match release tag '$TAG'" >&2; exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install cargo-cyclonedx
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.cargo-cyclonedx-version }}" ]; then
            cargo install cargo-cyclonedx --version "${{ inputs.cargo-cyclonedx-version }}" --locked
          else
            cargo install cargo-cyclonedx --locked
          fi

      - name: Generate SBOM
        run: cargo cyclonedx --format json --manifest-path "${{ inputs.cargo-manifest-path }}"

      - name: Validate SBOM shape
        env:
          SBOM: ${{ inputs.sbom-file }}
        run: |
          set -euo pipefail
          [[ -f "$SBOM" ]] || { echo "$SBOM was not generated" >&2; exit 1; }
          format=$(jq -r '.bomFormat' "$SBOM")
          [[ "$format" == "CycloneDX" ]] || {
            echo "$SBOM: bomFormat is '$format', not CycloneDX" >&2
            exit 1
          }
          component_count=$(jq '.components | length' "$SBOM")
          [[ "$component_count" -gt 0 ]] || {
            echo "$SBOM: components array is empty" >&2
            exit 1
          }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See the file header: `Release image` (tag push) and this workflow
      # (release published) are independent events with no ordering
      # guarantee, so poll instead of resolving the digest once.
      #
      # This runs, and the attest step below it runs, before the release
      # asset is uploaded: if the image hasn't finished pushing yet,
      # resolving the digest fails closed here with no release asset
      # uploaded, and a plain job re-run can pick up cleanly. Uploading the
      # SBOM first would leave a release with an asset but no attestation on
      # a re-run failure, and `gh release upload` without `--clobber` would
      # then refuse to re-upload it.
      - name: Resolve image digest
        id: image
        env:
          IMAGE: ${{ inputs.image }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
          MAX_ATTEMPTS: ${{ inputs.digest-max-attempts }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT:-${TAG#v}}"
          digest=""
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if resolved=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest) \
              && [[ -n "$resolved" && "$resolved" != "null" ]]; then
              digest="$resolved"
              break
            fi
            echo "image ${IMAGE}:${version} not available yet (attempt ${attempt}/${MAX_ATTEMPTS}); the image release may still be building -- waiting 60s"
            sleep 60
          done
          [[ -n "$digest" ]] || { echo "could not resolve digest for ${IMAGE}:${version} after ${MAX_ATTEMPTS} attempts" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: cosign attest SBOM (keyless)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SBOM: ${{ inputs.sbom-file }}
        run: cosign attest --yes --predicate "$SBOM" --type cyclonedx "${IMAGE}@${DIGEST}"

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          SBOM: ${{ inputs.sbom-file }}
        # --clobber: a re-run after a partial failure must be able to
        # re-upload without deleting the asset by hand first.
        run: gh release upload "$TAG" "$SBOM" --repo "${{ github.repository }}" --clobber
