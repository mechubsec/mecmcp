name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  build-test:
    name: Build, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        # dtolnay/rust-toolchain has no version tags; the channel name *is*
        # the ref, so pinning to a SHA freezes the stable toolchain this job
        # tests against rather than tracking whatever is newest. That is the
        # point (an unpinned branch ref is a supply-chain floater like any
        # other), but it means this SHA needs a deliberate bump now and then
        # -- check https://github.com/dtolnay/rust-toolchain/tree/stable for
        # the current head and re-pin periodically.
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        # `test-util` on both crates, or the tests behind it are silently not
        # run. They are gated because they reach doors the public API does not
        # offer -- seeding a change set in a state only the lifecycle can
        # produce, and installing a tracing subscriber per thread -- and a gate
        # that CI does not open is a test that does not exist.
        run: cargo test --workspace --locked --features mecmcp-audit/test-util,mecmcp-changeset/test-util,mecmcp-transport/test-util

      - name: Run verified-approver tests
        # `verified-approver` is not in the workspace --all-features test run above
        # (combining it with `otel` hits a one-process rustls CryptoProvider
        # conflict), so a plain --workspace run never executes the approver
        # assertion suite -- including the replay-inside-leeway and JWT-leak
        # regression tests -- and nothing would notice if it broke. Run it here,
        # isolated from `otel`, so it still gates merges.
        run: cargo test --locked -p mecmcp-transport --features test-util,verified-approver

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

  msrv:
    # mecmcp-auth is a library consumed by two binaries, so an accidental MSRV
    # bump breaks them rather than this repo. That makes it exactly the wrong
    # thing to discover downstream.
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the working toolchain; the MSRV floor declared
      # in Cargo.toml is deliberately lower. Remove the pin so the 1.89
      # toolchain below is what actually runs.
      - name: Drop the toolchain pin
        run: rm -f rust-toolchain.toml

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@b4f984c1e7daae8e175614de3e73a8411a20333c # 1.89.0

      # `Cargo.lock` is committed for the other jobs, but this one deletes it and
      # resolves fresh so it takes whatever the registry currently offers. That is
      # what makes it useful -- it catches a dependency raising its floor -- and
      # also what lets an unrelated release turn every open PR red with no commit
      # behind it. If a future dependency raises its floor above ours, pin it here
      # with `cargo update -p <crate> --precise <version>` rather than silently
      # raising the floor, because the floor is a promise the consumer repos
      # depend on.
      - name: Drop the committed lockfile
        run: rm -f Cargo.lock

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets

  conformance:
    name: Conformance fixtures
    runs-on: ubuntu-24.04
    # Matches its neighbours, and this job shells out to `docker build`.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Manifest reader
        run: bash packaging/conformance/tests/test-read-manifest.sh
      - name: Package fixtures
        run: bash packaging/conformance/tests/run-fixtures.sh
      - name: Image fixtures
        run: bash packaging/conformance/tests/test-verify-image.sh
