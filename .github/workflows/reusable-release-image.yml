name: Reusable / release container image

# Shared SBOM + build + keyless-cosign-sign pipeline for a container image
# release, called via `workflow_call` from a vendor repo's own release
# workflow (which owns the `on: push: tags:` / `workflow_dispatch` trigger).
#
# Extracted from rustjunosmcp's release-image.yml (MEC-49) so the sequence
# is defined once instead of re-implemented per repo (MEC-514). See
# docs/RELEASE-WORKFLOWS.md in this repo for how to call it and how to
# migrate an existing per-repo workflow.
#
# The calling job MUST grant these permissions itself -- a reusable
# workflow's permissions can only be narrowed by the caller, never widened:
#   permissions:
#     contents: read
#     packages: write
#     id-token: write   # required for keyless cosign signing
#
# Dual-push to Docker Hub (MEC-2110) is opt-in per caller: set the
# `dockerhub-image` input and pass the `dockerhub-username` /
# `dockerhub-token` secrets by mapping them explicitly to the org-level
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets -- this workflow declares
# exactly those two secrets, so there is no reason for a caller to use
# `secrets: inherit`, which would hand it every repo and org secret the
# caller's job can see. A caller that omits `dockerhub-image`, or whose
# secrets are unset (e.g. a fork with no access to org secrets), still gets
# a GHCR-only push with a warning instead of a failure.

on:
  workflow_call:
    inputs:
      image:
        description: 'Full GHCR image path, e.g. ghcr.io/mechubsec/rust-junosmcp'
        required: true
        type: string
      dockerhub-image:
        description: 'Full Docker Hub image path, e.g. docker.io/mechub/rust-junosmcp. Pushed with the same platforms as GHCR. Empty skips the Docker Hub push entirely.'
        required: false
        type: string
        default: ''
      dockerhub-readme:
        description: 'Path (relative to the repo root, not `context`) of the README to push as the Docker Hub repo overview.'
        required: false
        type: string
        default: 'README.md'
      description:
        description: 'Short description for the Docker Hub repo overview. Empty skips updating it (the README push still happens).'
        required: false
        type: string
        default: ''
      version:
        description: 'Version label for the image (-> tags {version}, {major.minor}, latest). Falls back to the pushed tag when empty.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref/commit to build. Defaults to the ref that triggered the caller workflow.'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Comma-separated platform list. Each platform builds on a native GitHub-hosted runner (linux/amd64 on ubuntu-24.04, linux/arm64 on ubuntu-24.04-arm) and both registries get one manifest list covering all of them. Any other platform is refused.'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      smoke-test-command:
        description: 'Optional shell command run on every platform runner after Buildx setup and before that platform is pushed (e.g. a container smoke test script). Skipped when empty.'
        required: false
        type: string
        default: ''
      cargo-cyclonedx-version:
        description: 'Pinned cargo-cyclonedx version for --version. Empty installs whatever --locked resolves.'
        required: false
        type: string
        default: ''
    secrets:
      dockerhub-username:
        description: 'Docker Hub username for the push + repo-overview update. Unused (and may be omitted) when dockerhub-image is empty.'
        required: false
      dockerhub-token:
        description: 'Docker Hub access token for the push + repo-overview update. Unused (and may be omitted) when dockerhub-image is empty.'
        required: false
    outputs:
      digest:
        description: 'Digest of the GHCR manifest list covering every platform.'
        value: ${{ jobs.merge.outputs.digest }}

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install cargo-cyclonedx
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.cargo-cyclonedx-version }}" ]; then
            cargo install cargo-cyclonedx --version "${{ inputs.cargo-cyclonedx-version }}" --locked
          else
            cargo install cargo-cyclonedx --locked
          fi
      # One .cdx.json per workspace member; whichever one matches the binary
      # that actually ships in the image is the one that matters, but
      # generating for the whole workspace is cheap and catches drift in the
      # others too.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: '**/*.cdx.json'
          retention-days: 90

  # Each platform builds on its own native runner and the merge job joins
  # them into one manifest list. Emulated (QEMU) Rust builds made a release
  # take most of an hour (rustunifimcp dc3b7e1), so a platform with no native
  # GitHub-hosted runner is refused rather than emulated.
  plan:
    name: Plan platforms
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      dockerhub-push: ${{ steps.dockerhub.outputs.push }}
    # No image names or labels here: GitHub drops a job output containing any
    # secret's value, and the Docker Hub username `mechub` is a substring of
    # every mechubsec path, so build and merge each run the metadata step.
    steps:
      - name: Map platforms to native runners
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(jq -cn --arg platforms "${PLATFORMS}" '
            {"linux/amd64": "ubuntu-24.04", "linux/arm64": "ubuntu-24.04-arm"} as $runners
            | [$platforms | split(",")[] | gsub("\\s"; "") | select(. != "")] | unique
            | map({platform: ., runner: $runners[.], slug: gsub("/"; "-")})')"
          unsupported="$(jq -r 'map(select(.runner == null) | .platform) | join(", ")' <<<"${matrix}")"
          if [ -n "${unsupported}" ]; then
            echo "::error::no native runner for platform(s): ${unsupported}; supported: linux/amd64, linux/arm64"
            exit 1
          fi
          if [ "$(jq length <<<"${matrix}")" -eq 0 ]; then
            echo "::error::the platforms input is empty"
            exit 1
          fi
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORMS: ${{ inputs.platforms }}

      # Decided once so every later job includes (or omits) the Docker Hub
      # reference the same way. Absent secrets are a fork/pre-P0 condition,
      # not a workflow bug, so this warns and continues GHCR-only rather than
      # failing the job.
      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          set -euo pipefail
          if [ -z "${DH_IMAGE}" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${DH_USERNAME}" ] || [ -z "${DH_TOKEN}" ]; then
            echo "::warning::dockerhub-image is set but the dockerhub-username/dockerhub-token secrets are missing; skipping the Docker Hub push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DH_IMAGE: ${{ inputs.dockerhub-image }}
          DH_USERNAME: ${{ secrets.dockerhub-username }}
          DH_TOKEN: ${{ secrets.dockerhub-token }}

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Labels only; keep `tags` identical to the merge job's copy, since the
      # version label derives from them.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Runs on every platform's runner, so the smoke test exercises each
      # architecture natively, and a command that prepares the build context
      # (mecfeedmcp swaps in Dockerfile.serve) applies to every leg.
      - name: Smoke test
        if: inputs.smoke-test-command != ''
        run: ${{ inputs.smoke-test-command }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.plan.outputs.dockerhub-push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      # Pushed untagged, by digest: no tag moves until the merge job has
      # every platform, so a failed leg leaves the published tags untouched.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ inputs.image }}${{ needs.plan.outputs.dockerhub-push == 'true' && format(',{0}', inputs.dockerhub-image) || '' }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest list
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing
    outputs:
      digest: ${{ steps.manifest.outputs.ghcr-digest }}
    steps:
      # Only the Docker Hub overview step reads the tree (the README).
      - name: Checkout
        if: needs.plan.outputs.dockerhub-push == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.image }}
            ${{ needs.plan.outputs.dockerhub-push == 'true' && inputs.dockerhub-image || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.plan.outputs.dockerhub-push == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      # One manifest list per registry, each from that registry's own
      # per-platform digests. Each list's digest is read back rather than
      # assumed equal across registries, and that digest is what gets signed.
      - name: Create manifest lists
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/digests"
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n')
          if [ "${#digests[@]}" -ne "$(jq length <<<"${MATRIX}")" ]; then
            echo "::error::expected $(jq length <<<"${MATRIX}") platform digests, found ${#digests[@]}"
            exit 1
          fi
          publish() {
            local image="$1" output="$2"
            local list_digest
            local -a tags args=()
            mapfile -t tags < <(jq -r --arg prefix "${image}:" '.tags[] | select(startswith($prefix))' <<<"${METADATA}")
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "::error::docker metadata produced no tags for ${image}"
              exit 1
            fi
            for tag in "${tags[@]}"; do args+=(-t "${tag}"); done
            for platform_digest in "${digests[@]}"; do args+=("${image}@sha256:${platform_digest}"); done
            docker buildx imagetools create "${args[@]}"
            # tags[0] is the {{version}} tag (metadata-action sorts semver
            # first), which no later release moves the way it moves latest.
            list_digest="$(docker buildx imagetools inspect "${tags[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
            if [[ "${list_digest}" != sha256:* ]]; then
              echo "::error::could not read the manifest-list digest of ${tags[0]} (got '${list_digest}')"
              exit 1
            fi
            echo "${output}=${list_digest}" >> "$GITHUB_OUTPUT"
          }
          publish "${GHCR_IMAGE}" ghcr-digest
          if [ "${DH_PUSH}" = "true" ]; then
            publish "${DH_IMAGE}" dockerhub-digest
          fi
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          METADATA: ${{ steps.meta.outputs.json }}
          GHCR_IMAGE: ${{ inputs.image }}
          DH_IMAGE: ${{ inputs.dockerhub-image }}
          DH_PUSH: ${{ needs.plan.outputs.dockerhub-push }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless) -- GHCR
        # Sign by digest, not by the mutable tags above -- a tag can be
        # repointed later, but the digest is what was actually just pushed.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.manifest.outputs.ghcr-digest }}

      - name: Sign image (keyless) -- Docker Hub
        if: needs.plan.outputs.dockerhub-push == 'true'
        # Sign the Docker Hub ref directly. `cosign copy --only=sig` copies
        # nothing for cosign v3 OCI-referrer signatures yet exits 0, which
        # would publish an unsigned image under a green run, so it is not
        # used. Signing the same digest a second time makes Rekor answer
        # 409 "equivalent entry already exists"; that is the only failure
        # tolerated here, and the verify gate below decides whether both
        # images are actually signed.
        shell: bash
        run: |
          set -uo pipefail
          out="$(cosign sign --yes "${IMAGE}@${DIGEST}" 2>&1)" && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            if echo "$out" | grep -Eqi '409|already exists'; then
              echo "::notice::Rekor entry already exists for this digest; relying on the verify gate."
            else
              exit "$rc"
            fi
          fi
        env:
          IMAGE: ${{ inputs.dockerhub-image }}
          DIGEST: ${{ steps.manifest.outputs.dockerhub-digest }}

      - name: Verify signatures (hard gate)
        # Fails the job if either pushed image lacks a valid keyless
        # signature from this reusable workflow.
        run: |
          set -euo pipefail
          refs="${GHCR_IMAGE}@${GHCR_DIGEST}"
          if [ "${DH_PUSH}" = "true" ]; then
            refs="${refs} ${DH_IMAGE}@${DH_DIGEST}"
          fi
          # Docker Hub's referrers index is eventually consistent: a signature
          # pushed <1 s ago can read as "no signatures found" (#595). Retry
          # each ref, 6 attempts over ~59 s; the gate stays hard.
          for ref in ${refs}; do
            echo "Verifying ${ref}"
            attempt=1
            for delay in 2 4 8 15 30 0; do
              if cosign verify \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-identity-regexp '^https://github\.com/mechubsec/mecmcp/\.github/workflows/reusable-release-image\.yml@' \
                "${ref}" > /dev/null; then
                break
              fi
              if [ "${delay}" -eq 0 ]; then
                echo "::error::cosign verify failed for ${ref} after ${attempt} attempts"
                exit 1
              fi
              echo "cosign verify attempt ${attempt}/6 failed for ${ref}; retrying in ${delay}s"
              sleep "${delay}"
              attempt=$((attempt + 1))
            done
          done
        env:
          GHCR_IMAGE: ${{ inputs.image }}
          GHCR_DIGEST: ${{ steps.manifest.outputs.ghcr-digest }}
          DH_IMAGE: ${{ inputs.dockerhub-image }}
          DH_DIGEST: ${{ steps.manifest.outputs.dockerhub-digest }}
          DH_PUSH: ${{ needs.plan.outputs.dockerhub-push }}

      - name: Derive Docker Hub repository name
        id: dockerhub-repo
        if: needs.plan.outputs.dockerhub-push == 'true'
        run: echo "repo=${IMAGE#docker.io/}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ inputs.dockerhub-image }}

      - name: Push Docker Hub repo overview
        if: needs.plan.outputs.dockerhub-push == 'true'
        # Runs last, after signing and the image/SBOM/provenance push above,
        # so this step's failure never skips those. Updating a repo overview
        # needs a Docker Hub token scope beyond push; a token without it
        # 401s here. That's a cosmetic metadata gap, not a failed release,
        # so it must not fail the job.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}
          repository: ${{ steps.dockerhub-repo.outputs.repo }}
          readme-filepath: ${{ inputs.dockerhub-readme }}
          short-description: ${{ inputs.description }}
