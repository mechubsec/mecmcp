name: Reusable / release container image

# Shared SBOM + build + keyless-cosign-sign pipeline for a container image
# release, called via `workflow_call` from a vendor repo's own release
# workflow (which owns the `on: push: tags:` / `workflow_dispatch` trigger).
#
# Extracted from rustjunosmcp's release-image.yml (MEC-49) so the sequence
# is defined once instead of re-implemented per repo (MEC-514). See
# docs/RELEASE-WORKFLOWS.md in this repo for how to call it and how to
# migrate an existing per-repo workflow.
#
# The calling job MUST grant these permissions itself -- a reusable
# workflow's permissions can only be narrowed by the caller, never widened:
#   permissions:
#     contents: read
#     packages: write
#     id-token: write   # required for keyless cosign signing
#
# Dual-push to Docker Hub (MEC-2110) is opt-in per caller: set the
# `dockerhub-image` input and pass the `dockerhub-username` /
# `dockerhub-token` secrets (`secrets: inherit` or explicit mapping to the
# org-level DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets). A caller that
# omits `dockerhub-image`, or whose secrets are unset (e.g. a fork with no
# access to org secrets), still gets a GHCR-only push with a warning instead
# of a failure.

on:
  workflow_call:
    inputs:
      image:
        description: 'Full GHCR image path, e.g. ghcr.io/mechubsec/rust-junosmcp'
        required: true
        type: string
      dockerhub-image:
        description: 'Full Docker Hub image path, e.g. docker.io/mechubsec/rust-junosmcp. Empty skips the Docker Hub push entirely.'
        required: false
        type: string
        default: ''
      dockerhub-readme:
        description: 'Path (relative to the repo root, not `context`) of the README to push as the Docker Hub repo overview.'
        required: false
        type: string
        default: 'README.md'
      description:
        description: 'Short description for the Docker Hub repo overview. Empty skips updating it (the README push still happens).'
        required: false
        type: string
        default: ''
      version:
        description: 'Version label for the image (-> tags {version}, {major.minor}, latest). Falls back to the pushed tag when empty.'
        required: false
        type: string
        default: ''
      ref:
        description: 'Git ref/commit to build. Defaults to the ref that triggered the caller workflow.'
        required: false
        type: string
        default: ''
      context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
      platforms:
        description: 'Comma-separated platform list for docker/build-push-action, e.g. linux/amd64,linux/arm64'
        required: false
        type: string
        default: 'linux/amd64'
      smoke-test-command:
        description: 'Optional shell command run after Buildx setup and before push (e.g. a container smoke test script). Skipped when empty.'
        required: false
        type: string
        default: ''
      cargo-cyclonedx-version:
        description: 'Pinned cargo-cyclonedx version for --version. Empty installs whatever --locked resolves.'
        required: false
        type: string
        default: ''
    secrets:
      dockerhub-username:
        description: 'Docker Hub username for the push + repo-overview update. Unused (and may be omitted) when dockerhub-image is empty.'
        required: false
      dockerhub-token:
        description: 'Docker Hub access token for the push + repo-overview update. Unused (and may be omitted) when dockerhub-image is empty.'
        required: false
    outputs:
      digest:
        description: 'Digest of the pushed image, as returned by docker/build-push-action.'
        value: ${{ jobs.build-push.outputs.digest }}

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install cargo-cyclonedx
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.cargo-cyclonedx-version }}" ]; then
            cargo install cargo-cyclonedx --version "${{ inputs.cargo-cyclonedx-version }}" --locked
          else
            cargo install cargo-cyclonedx --locked
          fi
      # One .cdx.json per workspace member; whichever one matches the binary
      # that actually ships in the image is the one that matters, but
      # generating for the whole workspace is cheap and catches drift in the
      # others too.
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: '**/*.cdx.json'
          retention-days: 90

  build-push:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # Decided before the metadata step so the images list below can
      # include (or omit) the Docker Hub reference in one place. Absent
      # secrets are a fork/pre-P0 condition, not a workflow bug, so this
      # warns and continues GHCR-only rather than failing the job.
      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          set -euo pipefail
          if [ -z "${DH_IMAGE}" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${DH_USERNAME}" ] || [ -z "${DH_TOKEN}" ]; then
            echo "::warning::dockerhub-image is set but the dockerhub-username/dockerhub-token secrets are missing; skipping the Docker Hub push."
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          DH_IMAGE: ${{ inputs.dockerhub-image }}
          DH_USERNAME: ${{ secrets.dockerhub-username }}
          DH_TOKEN: ${{ secrets.dockerhub-token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ inputs.image }}
            ${{ steps.dockerhub.outputs.push == 'true' && inputs.dockerhub-image || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm') || contains(inputs.platforms, 'ppc') || contains(inputs.platforms, 's390x')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke test
        if: inputs.smoke-test-command != ''
        run: ${{ inputs.smoke-test-command }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image (keyless) -- GHCR
        # Sign by digest, not by the mutable tags above -- a tag can be
        # repointed later, but the digest is what was actually just pushed.
        # Cosign writes the signature into the same repo as the ref it
        # signs, so GHCR and Docker Hub each need their own sign call even
        # though they share the same digest.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Sign image (keyless) -- Docker Hub
        if: steps.dockerhub.outputs.push == 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ inputs.dockerhub-image }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Derive Docker Hub repository name
        id: dockerhub-repo
        if: steps.dockerhub.outputs.push == 'true'
        run: echo "repo=${IMAGE#docker.io/}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ inputs.dockerhub-image }}

      - name: Push Docker Hub repo overview
        if: steps.dockerhub.outputs.push == 'true'
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}
          repository: ${{ steps.dockerhub-repo.outputs.repo }}
          readme-filepath: ${{ inputs.dockerhub-readme }}
          short-description: ${{ inputs.description }}
