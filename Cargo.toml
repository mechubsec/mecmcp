[workspace]
members  = ["crates/mecmcp-auth", "crates/mecmcp-audit", "crates/mecmcp-changeset", "crates/mecmcp-scp", "crates/mecmcp-transport", "crates/mecmcp-runtime", "crates/mecmcp-policy", "crates/mecmcp-inventory", "crates/mecmcp-device", "crates/mecmcp-secret", "crates/mecmcp-http", "crates/mecmcp-job", "crates/mecmcp-openapi", "crates/mecmcp-oidc", "crates/mecmcp-redact", "crates/mecmcp-server", "crates/mecmcp-approve"]
resolver = "2"

[workspace.package]
version      = "0.27.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT"
repository   = "https://github.com/mechubsec/mecmcp"
authors      = ["fastrevmd-lab"]

[workspace.dependencies]
arc-swap   = "1"
async-trait = "0.1"
base64     = "0.23"
chrono     = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ed25519-dalek = { version = "3" }
getrandom  = "0.4"
globset    = "0.4"
hmac       = "0.13"
metrics    = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
quick-xml  = "0.42"
# Require russh >=0.63 for two reasons:
# 1. CVE-2026-68930 mitigation (SSH handshake vulnerability in 0.62.0-0.62.4)
# 2. PublicKeyOrCertificate API required by the host-key verification handler (added in 0.63)
# Do not relax the floor — Cargo.lock is committed, but that only pins already-resolved
# builds; anyone who runs `cargo update` picks this floor right back up, so the bound here
# is the real protection.
russh      = { version = ">=0.63, <0.65", default-features = false, features = ["flate2", "aws-lc-rs"] }
rustix     = { version = "1", features = ["fs", "process"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.11"
subtle     = "2"
tempfile   = "3"
thiserror  = "2"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing    = "0.1"
log        = "0.4"
tracing-log = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid       = { version = "1", features = ["v4"] }
zeroize    = { version = "1", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
