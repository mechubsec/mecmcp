[package]
name       = "mecmcp-runtime"
version.workspace    = true
edition.workspace    = true
rust-version.workspace = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[features]
# Exposes `cli_validate::testing`, the shared refusal-fixture and exact-
# stderr helper consumers use to pin their own binary's output against the
# messages this crate promises (mirrors mecmcp-redact's and mecmcp-audit's
# `test-util` -> `testing`/`testutil` pattern). Must NOT be enabled by
# default; it only exists for other crates' dev-dependencies and integration
# tests.
test-util = []

[dependencies]
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
getrandom   = { workspace = true }
http        = "1"
mecmcp-audit = { version = "0.27.0", path = "../mecmcp-audit" }
mecmcp-auth = { version = "0.27.0", path = "../mecmcp-auth" }
mecmcp-secret = { version = "0.27.0", path = "../mecmcp-secret" }
rustix      = { workspace = true, features = ["process", "fs"] }
thiserror   = { workspace = true }
tokio       = { version = "1", features = ["rt", "signal", "sync"] }
tokio-util  = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
# Only the grant-lifecycle tests need this: they define a non-unit grant to
# prove `run_with_grant` round-trips a real vendor grant (mecmcp#160). The
# library itself names the bound via `mecmcp_auth::StoredGrant` and does not
# depend on serde.
serde    = { version = "1", features = ["derive"] }
tempfile = { workspace = true }
tokio    = { version = "1", features = ["macros", "rt", "time"] }
# Test-only: `test-util` exposes the audit capture helper used to assert on
# `token set-scopes`/`set-provenance` audit events. It must NOT be enabled by
# default — the library dependency above stays plain.
mecmcp-audit = { version = "0.27.0", path = "../mecmcp-audit", features = ["test-util"] }

[lints]
workspace = true
