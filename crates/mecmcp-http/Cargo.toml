[package]
name        = "mecmcp-http"
description = "Vendor-neutral hardened outbound HTTP client for mechub MCP servers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[features]
# Gates HttpRequest::from_absolute_url. Off by default: a vendor MCP server
# building REST calls from a device- or model-supplied id must go through
# HttpRequest::with_base_and_path, where the path component is a
# mecmcp_openapi::ExpandedPath and cannot be a hand-assembled string. Enable
# this only for callers that genuinely need a full, non-path-templated URL
# (OIDC discovery/JWKS documents point wherever the issuer's metadata says).
absolute-url = []

[dependencies]
mecmcp-openapi = { version = "0.27.0", path = "../mecmcp-openapi" }
mecmcp-secret = { version = "0.27.0", path = "../mecmcp-secret" }
# "rustls-no-provider", NOT "rustls". Decision D4: the provider is a parameter
# the consumer picks, and reqwest's "rustls" feature would enable
# rustls/aws-lc-rs as a Cargo feature across the whole graph. That unification is
# how aws-lc-rs got linked into a ring build and broke TLS before — see the note
# in mecmcp-transport/Cargo.toml. A consumer must install a CryptoProvider;
# `HttpClient::new` checks and reports that rather than letting reqwest panic.
# No "http2", and `.http1_only()` on the builder — the builder call is the
# guarantee, since a Cargo feature unifies back on from anywhere in the
# consumer's graph.
#
# The reason is narrower than an earlier version of this comment claimed, and the
# correction is worth keeping. h2 renders a GOAWAY frame's `debug_data`
# (h2-0.4.15/src/error.rs:191) into the error chain; that is by design, not an h2
# bug, and this crate now bounds and sanitises causes rather than relying on the
# protocol being absent (#181).
#
# The other reason originally given does NOT hold: hyper's unchecked
# `*known -= amt` in `DecodedLength::sub_if` (hyper-1.11.0/src/body/length.rs:73)
# is real code but unreachable, because h2 validates Content-Length against DATA
# frames with `checked_sub` and resets the stream first
# (h2-0.4.15/src/proto/streams/stream.rs:340, proto/streams/recv.rs:695).
#
# HTTP/1.1 stays, on its own merits: management-plane API calls do not need
# multiplexing, and a protocol not compiled in is a protocol that cannot surprise
# us.
reqwest       = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Direct dependency only to detect a missing process-wide CryptoProvider.
# Deliberately no provider feature here either, for the same reason.
rustls        = { version = "0.23", default-features = false, features = ["std"] }
# Direct dependency purely to validate operator-supplied PEM eagerly — see the
# comment in `HttpClient::new`. Already in the tree via reqwest.
rustls-pki-types = "1"
# Validates that a supplied root really is a parseable X.509 certificate.
# `reqwest::Certificate::from_der` only wraps the bytes, so without this a
# malformed root escapes to `builder.build()` and the operator loses which entry
# was at fault. No crypto provider needed for `anchor_from_trusted_cert`.
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
thiserror     = { workspace = true }
tokio         = { version = "1", features = ["sync", "time"] }
zeroize       = { workspace = true }

[dev-dependencies]
rcgen        = "0.14"
rustls       = { version = "0.23", features = ["aws-lc-rs"] }
tempfile     = { workspace = true }
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "test-util"] }
tokio-rustls = "0.26"
