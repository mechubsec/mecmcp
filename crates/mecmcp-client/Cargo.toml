[package]
name        = "mecmcp-client"
description = "Shared streamable-HTTP MCP client for mechub tooling: hardened bearer-token loading, bounded responses, and terminal-safe rendering of untrusted server text."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
# Deliberately no mecmcp-transport / mecmcp-http: a client has no business
# linking the server-side device transport or concurrency queue.
mecmcp-secret = { version = "0.34.0", path = "../mecmcp-secret" }
thiserror     = { workspace = true }
url           = "2"
# rmcp's own `reqwest` feature is deliberately off: it enables reqwest/rustls and
# with it a second rustls provider. We hand rmcp a reqwest::Client we built.
rmcp       = { version = "3", default-features = false, features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
reqwest    = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls     = { version = "0.23", default-features = false, features = ["std"] }
http       = "1"
futures    = "0.3"
sse-stream = "0.2"
serde_json = { workspace = true }
tokio      = { version = "1", features = ["time", "sync"] }

[dev-dependencies]
tempfile         = { workspace = true }
# test-util only here: the real-server tests, never a normal dependency.
mecmcp-transport = { version = "0.34.0", path = "../mecmcp-transport", features = ["test-util"] }
mecmcp-auth      = { version = "0.34.0", path = "../mecmcp-auth" }
rmcp             = { version = "3", default-features = false, features = ["server"] }
tokio-util       = { workspace = true }
rcgen            = "0.14"
rustls           = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["tls12"] }
tokio            = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
