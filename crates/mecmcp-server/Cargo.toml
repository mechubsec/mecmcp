[package]
name        = "mecmcp-server"
description = "Vendor-neutral MCP handler helpers: bounded results and scope authorization for mechub MCP servers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
# `default-features = false`: only `rmcp::model` is needed here. The transport
# features live in mecmcp-transport, and a handler-helper crate that dragged a
# server transport in would unify those features into every consumer's build
# whether or not they use that transport (decision D4).
http         = "1"
mecmcp-audit  = { version = "0.28.0", path = "../mecmcp-audit" }
mecmcp-auth   = { version = "0.28.0", path = "../mecmcp-auth" }
mecmcp-redact = { version = "0.28.0", path = "../mecmcp-redact" }
# For xml_to_json: same parser family mecmcp-redact already vets for this
# ecosystem, so a device XML reply is walked with one parser, not two that
# could disagree about where a tag ends.
quick-xml   = { workspace = true }
rmcp        = { version = "3", default-features = false }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
mecmcp-audit = { version = "0.28.0", path = "../mecmcp-audit", features = ["test-util"] }
tracing-subscriber = { workspace = true }
# Test-only: CallerCtx carries a per-request correlation ID (mecmcp#269).
uuid        = { workspace = true }
