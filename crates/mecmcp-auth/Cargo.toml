[package]
name        = "mecmcp-auth"
description = "Vendor-neutral bearer-token authentication and scopes for mechub MCP servers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[features]
# Exposes test-only constructors (e.g. `VerifiedApprover::for_test`) that
# bypass the normal verification path. Never enable this outside dev-deps.
test-util = []

[dependencies]
mecmcp-secret = { version = "0.28.0", path = "../mecmcp-secret" }
arc-swap   = { workspace = true }
chrono     = { workspace = true }
getrandom  = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
subtle     = { workspace = true }
tempfile   = { workspace = true }
thiserror  = { workspace = true }
uuid       = { workspace = true }
zeroize    = { workspace = true }

[target.'cfg(unix)'.dependencies]
