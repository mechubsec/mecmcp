[package]
name         = "mecmcp-changeset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mecmcp-audit = { version = "0.27.0", path = "../mecmcp-audit" }
async-trait  = { workspace = true }
hex          = "0.4"
serde        = { workspace = true }
serde_json   = { workspace = true, features = ["preserve_order"] }
sha2         = { workspace = true }
hmac         = { workspace = true }
subtle       = { workspace = true }
getrandom    = { workspace = true }
tokio        = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util   = { version = "0.7" }
tempfile     = { workspace = true }
mecmcp-secret = { version = "0.27.0", path = "../mecmcp-secret" }
mecmcp-redact = { version = "0.27.0", path = "../mecmcp-redact" }
rustix       = { workspace = true }
# Reporting only: the one place an evidence write can fail after the device has
# already acted, where refusing is impossible and silence is unacceptable.
tracing      = { workspace = true }
url          = "2"
zeroize      = { workspace = true }

[features]
# Test-only seeding of records in states the public API will not create.
# `insert_change_set` creates `Planned` only, because accepting any other state
# is a door straight into the lifecycle the transition policy governs. Tests
# still need records in `Expired`, `Applying` and so on, so they get an explicit
# door rather than the production one being widened for their benefit.
test-util = []

[dev-dependencies]
hex = "0.4"
mecmcp-auth = { version = "0.27.0", path = "../mecmcp-auth", features = ["test-util"] }
# `rt-multi-thread` for tests only. The atomic-claim test has to be able to
# fail: on a current-thread runtime the claimants never interleave, so a
# non-atomic claim would pass it.
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true

# Seeds records in states the public API will not create, so it needs the
# test-only door; without this the default `cargo test` fails to compile it
# rather than skipping it.
[[test]]
name = "preview_binding_test"
required-features = ["test-util"]

[[test]]
name = "atomic_apply_claim_test"
required-features = ["test-util"]

[[test]]
name = "task5_coordinator_test"
required-features = ["test-util"]

[[test]]
name = "waiver_lapse_test"
required-features = ["test-util"]

[[test]]
name = "expired_lockout_test"
required-features = ["test-util"]

[[test]]
name = "in_flight_recovery_test"
required-features = ["test-util"]

[[test]]
name = "device_lock_test"
required-features = ["test-util"]

[[test]]
