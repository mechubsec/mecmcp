[package]
name        = "mecmcp-audit"
description = "Vendor-neutral audit events, attribution, and redaction for mechub MCP servers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
mecmcp-auth = { version = "0.27.0", path = "../mecmcp-auth" }
mecmcp-secret = { version = "0.27.0", path = "../mecmcp-secret" }
base64      = { workspace = true }
chrono      = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom   = { workspace = true }
hex         = "0.4"
hmac        = { workspace = true }
metrics     = { workspace = true }
rustix      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
tempfile    = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
urlencoding = "2"
zeroize     = { workspace = true }
# Both already in the graph via tracing-subscriber's default features, so naming
# them directly adds no crate. Needed because `init_tracing` installs the
# subscriber and the `log` bridge as separate steps — see the note there.
log         = { workspace = true }
tracing-log = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true }
uuid        = { workspace = true }

# Optional: only pulled in when a consumer enables the `otel` feature. This
# family is ~90 extra crates, so a server that never sets `--otel-endpoint`
# must not carry them -- see `otel.rs` for the offline-first / D4 reasoning.
# `default-features = false` on `opentelemetry-otlp` with only "http-proto" +
# "reqwest-blocking-client" pulls reqwest with no TLS backend at all: it can
# only reach plain `http://`, so this never becomes a second place to make
# decision D4's rustls-provider choice (see mecmcp-transport's Cargo.toml).
# A remote OTLP collector is reached the same way a remote ClickHouse is —
# through a loopback TLS-terminating proxy, not by this crate speaking TLS.
opentelemetry = { version = "0.33", optional = true }
opentelemetry_sdk = { version = "0.33", optional = true }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }
tracing-opentelemetry = { version = "0.34", optional = true }

[features]
test-util = []
# Off by default: OpenTelemetry export is an offline-first opt-in, not a
# default dependency of every mecmcp server. See `otel.rs`.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
# Test-only: the exporter is used solely to render metrics in unit tests.
# It must NOT be a normal dependency — its default features pull an HTTP
# listener and hyper-rustls, which enables rustls's aws-lc-rs backend and
# conflicts with a consumer that pins `ring`. That broke TLS in a downstream
# server. Keep it here, and keep default-features off.
metrics-exporter-prometheus = { workspace = true }

# `testutil` is gated behind `test-util`, and an integration target does not get
# `cfg(test)` on the library — so without this, `cargo test -p mecmcp-audit`
# fails to compile this target rather than running it.
[[test]]
name = "capture_under_concurrency"
required-features = ["test-util"]

[[test]]
name = "capture_callsite_registration"
required-features = ["test-util"]
