[package]
name        = "mecmcp-scp"
description = "SCP1 file transfer client for legacy SSH-based devices."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints.rust]
missing_docs = "warn"
unsafe_code  = "deny"  # Allow targeted #[allow(unsafe_code)] unlike workspace forbid

[lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "warn"

[dependencies]
async-trait   = "0.1"
base64        = "0.23"
hmac          = "0.13"
mecmcp-secret = { version = "0.27.0", path = "../mecmcp-secret" }
russh         = { workspace = true }
rustix        = { workspace = true }
sha1          = "0.11"
tempfile      = { workspace = true }
thiserror     = { workspace = true }
tokio         = { version = "1", features = ["fs", "io-util", "process", "rt", "sync"] }
tokio-util    = { workspace = true, features = ["codec"] }
tracing       = { workspace = true }

[dev-dependencies]
rand     = "0.10"
tempfile = { workspace = true }
tokio    = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
